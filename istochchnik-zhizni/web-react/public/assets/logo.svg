<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Знак церкви — латинский крест</title>
  <desc id="desc">Современный латинский крест: длинная вертикаль и перекладина в верхней части.</desc>
  <defs>
    <linearGradient id="crossWarm" x1="256" y1="72" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6F1D32"/>
      <stop offset="0.5" stop-color="#92405A"/>
      <stop offset="1" stop-color="#C98B60"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#crossWarm)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <line x1="256" y1="92" x2="256" y2="420"/>
    <line x1="132" y1="208" x2="380" y2="208"/>
  </g>
</svg>
