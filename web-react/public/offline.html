<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Нет подключения</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100%;
        min-height: -webkit-fill-available;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: #0f0f0f;
        color: #f5f5f5;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .card {
        width: min(100%, 24rem);
        border-radius: 1rem;
        background: #161616;
        border: 1px solid #262626;
        padding: 1.5rem;
        text-align: center;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
      }
      .icon {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1rem;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        line-height: 1.25;
      }
      p {
        margin: 0.75rem 0 0;
        color: #b8b8b8;
        font-size: 1rem;
        line-height: 1.5;
      }
      .status {
        margin-top: 1rem;
        font-size: 0.875rem;
        color: #a1a1aa;
      }
      button {
        margin-top: 1.25rem;
        width: 100%;
        border: 0;
        border-radius: 0.75rem;
        background: #7d3640;
        color: #ffffff;
        font-size: 1rem;
        font-weight: 700;
        padding: 0.8rem 1rem;
      }
      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M2.3 8.6A15.4 15.4 0 0 1 12 5c3.8 0 7.3 1.3 9.7 3.6l-1.8 1.8A12.8 12.8 0 0 0 12 7.6c-2.8 0-5.4.9-7.5 2.8z"
          fill="#8a8a8a"
        />
        <path
          d="M6.4 12.7A8.7 8.7 0 0 1 12 10.7c2.3 0 4.4.7 5.9 2l-1.9 1.9a5.8 5.8 0 0 0-4-1.3c-1.4 0-2.7.4-3.8 1.3z"
          fill="#8a8a8a"
        />
        <path d="m2 3.8 18.2 18.2-1.8 1.8L.2 5.6z" fill="#ef4444" />
        <circle cx="12" cy="18.1" r="1.6" fill="#ef4444" />
      </svg>
      <h1>Нет подключения</h1>
      <p>Проверьте интернет и попробуйте снова</p>
      <p class="status" id="statusText">Оффлайн</p>
      <button type="button" id="retryBtn">Попробовать снова</button>
    </main>
    <script>
      const statusText = document.getElementById('statusText');
      const updateStatus = () => {
        statusText.textContent = navigator.onLine ? 'Соединение восстановлено' : 'Оффлайн';
      };
      updateStatus();
      window.addEventListener('online', () => window.location.reload());
      window.addEventListener('offline', updateStatus);
      document.getElementById('retryBtn').addEventListener('click', () => window.location.reload());
    </script>
  </body>
</html>
