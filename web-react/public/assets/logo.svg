<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Знак церкви — латинский крест</title>
  <desc id="desc">Латинский крест в теплом градиенте на мягком светлом фоне.</desc>
  <defs>
    <linearGradient id="crossWarm" x1="512" y1="180" x2="512" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A1E41"/>
      <stop offset="0.55" stop-color="#9A3D66"/>
      <stop offset="1" stop-color="#D6945F"/>
    </linearGradient>
    <linearGradient id="bgSoft" x1="140" y1="120" x2="900" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8F8F8"/>
      <stop offset="1" stop-color="#ECECEC"/>
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#2E1320" flood-opacity="0.22"/>
    </filter>
    <filter id="crossShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#2B0F1D" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="190" fill="url(#bgSoft)" filter="url(#iconShadow)"/>

  <g fill="none" stroke="url(#crossWarm)" stroke-width="82" stroke-linecap="round" stroke-linejoin="round" filter="url(#crossShadow)">
    <line x1="512" y1="246" x2="512" y2="820"/>
    <line x1="278" y1="430" x2="746" y2="430"/>
  </g>
</svg>
