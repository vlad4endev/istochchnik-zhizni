<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Минимальный латинский крест</title>
  <desc id="desc">Компактный латинский крест для малых размеров.</desc>
  <defs>
    <linearGradient id="minimalCross" x1="256" y1="80" x2="256" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7D3640"/>
      <stop offset="1" stop-color="#B85B50"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#minimalCross)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <line x1="256" y1="92" x2="256" y2="420"/>
    <line x1="132" y1="208" x2="380" y2="208"/>
  </g>
</svg>
