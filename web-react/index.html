<!doctype html>
<html lang="ru" class="app-native-shell">
  <head>
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('mantine-color-scheme-value');
          const scheme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
        } catch {
          document.documentElement.setAttribute('data-mantine-color-scheme', 'light');
        }
        try {
          var standalone =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: fullscreen)').matches ||
            window.matchMedia('(display-mode: minimal-ui)').matches;
          if (standalone) {
            document.documentElement.dataset.pwaStandalone = '1';
            var android = /Android/i.test(navigator.userAgent);
            if (android) {
              document.documentElement.dataset.androidPwa = '1';
              document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
                meta.setAttribute('content', '#f0ebe3');
              });
            }
          }
        } catch {
          /* ignore */
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <!-- Без ручного pinch/double-tap zoom: размер — из ОС и панели доступности (CSS), не из зума страницы. -->
    <!-- interactive-widget=resizes-content: Android Chrome/WebView — layout viewport при клавиатуре; см. nativeShellViewport.ts LOCKED_VIEWPORT. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Моя церковь" />
    <meta name="theme-color" content="#7d3640" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#5c2830" media="(prefers-color-scheme: dark)" />
    <!-- iOS «На экран Домой»: полноэкранный режим и имя под иконкой -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Дубль для новых версий WebKit (рядом с apple-* для совместимости) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Моя церковь" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Моя церковь - цифровая платформа</title>
    <!-- Иконки и favicon (public/assets; см. npm run pwa:icons) -->
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
    <!-- Одна иконка 180×180: Apple сам масштабирует; дубли с «левыми» sizes давали лишний шум и путаницу для WebKit. -->
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon-180x180.png" sizes="180x180" />

    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-1320-2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-1242-2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-750-1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <!-- Сплэш до React: тот же вид, что AppSplash.tsx -->
    <link rel="preload" href="/assets/logo.svg" as="image" type="image/svg+xml" />
    <link rel="stylesheet" href="/app-splash.css" />
    <!-- Progressier (push): подключается из main.tsx после первого кадра — не блокировать парсинг/сеть PWA. -->
  </head>
  <body style="margin:0;background:#f0ebe3">
    <!-- До загрузки React: анимированный сплэш вместо пустого фона. -->
    <div id="root" style="min-height:100dvh;min-height:-webkit-fill-available">
      <div class="app-splash" role="status" aria-live="polite" aria-label="Загрузка приложения">
        <div class="app-splash__bg" aria-hidden="true">
          <div class="app-splash__orb app-splash__orb--1"></div>
          <div class="app-splash__orb app-splash__orb--2"></div>
          <div class="app-splash__orb app-splash__orb--3"></div>
        </div>
        <div class="app-splash__center">
          <div class="app-splash__logo-shell">
            <span class="app-splash__halo"></span>
            <span class="app-splash__ring"></span>
            <span class="app-splash__ring app-splash__ring--2"></span>
            <img src="/assets/logo.svg" alt="" class="app-splash__logo" decoding="async" />
          </div>
          <h1 class="app-splash__title">Моя церковь</h1>
          <p class="app-splash__tagline">Цифровая платформа</p>
        </div>
        <div class="app-splash__footer" aria-hidden="true">
          <div class="app-splash__loader"><div class="app-splash__loader-bar"></div></div>
          <p class="app-splash__status">Загрузка</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
