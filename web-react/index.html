    <script>
      /* ES5-совместимый bootstrap: без optional catch / const — на очень старых WebKit
         SyntaxError здесь блокирует весь head до React (белый экран PWA). */
      (function () {
        try {
          var stored = localStorage.getItem('mantine-color-scheme-value');
          var scheme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
        } catch (e1) {
          document.documentElement.setAttribute('data-mantine-color-scheme', 'light');
        }
        /*
         * Тема из панели доступности применяется ДО первого кадра: иначе сплэш и экран
         * «не удалось открыть приложение» вспыхивают светлыми у тех, кто выбрал тёмную тему.
         * Логика зеркалит applyDocumentAccessibility.ts.
         */
        try {
          var a11y = JSON.parse(localStorage.getItem('istoch-life-a11y-v1') || 'null');
          var ct = a11y && a11y.colorTheme;
          var de = document.documentElement;
          var bg = { sepia: '#f2e8d5', dark: '#121214', 'high-contrast': '#000000', blue: '#0b1628' };
          var chrome = { sepia: '#5c4330', dark: '#121214', 'high-contrast': '#000000', blue: '#0b1628' };
          if (ct && bg[ct]) {
            de.setAttribute('data-color-theme', ct);
            if (ct === 'sepia') de.classList.add('theme-sepia');
            else de.classList.add('dark');
            de.setAttribute('data-mantine-color-scheme', ct === 'sepia' ? 'light' : 'dark');
            de.style.backgroundColor = bg[ct];
            var slot = document.querySelector('meta[name="theme-color"][data-app-managed="true"]');
            if (slot) slot.setAttribute('content', chrome[ct]);
          }
        } catch (e0) {
          /* ignore */
        }
        try {
          var standalone =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: fullscreen)').matches ||
            window.matchMedia('(display-mode: minimal-ui)').matches;
          if (standalone) {
            document.documentElement.setAttribute('data-pwa-standalone', '1');
            var android = /Android/i.test(navigator.userAgent);
            if (android) {
              document.documentElement.setAttribute('data-android-pwa', '1');
              var metas = document.querySelectorAll('meta[name="theme-color"]');
              for (var mi = 0; mi < metas.length; mi++) {
                metas[mi].setAttribute('content', '#f0ebe3');
              }
            }
          }
          /*
           * iOS: класс оболочки. CSS сам кладёт 100vh → 100lvh (cascade), поэтому
           * на Safari < 15.4 остаётся 100vh, на 15.4+ — 100lvh. Не завязываемся на
           * major>=17.5 (старый порог ломал iOS 15–17).
           */
          var ua = navigator.userAgent || '';
          var apple =
            /iPad|iPhone|iPod/i.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          if (apple) {
            document.documentElement.classList.add('app-ios-lvh-shell');
          }
        } catch (e2) {
          /* ignore */
        }
      })();
    </script>

    <!-- Без ручного pinch/double-tap zoom: размер — из ОС и панели доступности (CSS), не из зума страницы. -->
    <!-- interactive-widget=resizes-content только на Android: на iOS Safari сжимает оболочку (белый экран, таббар посредине). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover" />
    <script>
      (function () {
        if (!/Android/i.test(navigator.userAgent)) return;
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta) {
          meta.setAttribute(
            'content',
            'width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover, interactive-widget=resizes-content',
          );
        }
      })();
    </script>

    <!--
      Слот под тему приложения. Умышленно без content и первым по порядку в дереве:
      HTML-стандарт («To obtain a page's theme color») берёт ПЕРВЫЙ meta[name=theme-color],
      у которого есть content и совпадает media. Без content этот элемент не кандидат,
      поэтому до старта React работает пара ниже — по системной светлой/тёмной схеме.
      Как только applyDocumentAccessibility.ts впишет сюда content, слот становится первым
      кандидатом и перекрывает системную пару: цвет chrome/статус-бара начинает следовать
      выбранной в приложении теме (dark / sepia / high-contrast), а не схеме ОС.

      Раньше этот meta создавался в рантайме и добавлялся в конец head — то есть ПОСЛЕ
      пары с media, из которой одна ветка совпадает всегда. По стандарту выигрывает первый,
      так что тема приложения до chrome не доходила вовсе.
    -->
    <meta name="theme-color" data-app-managed="true" />
    <meta name="theme-color" content="#7d3640" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#5c2830" media="(prefers-color-scheme: dark)" />

    <!-- До загрузки React: анимированный сплэш вместо пустого фона. -->
    <!--
      Без inline min-height на #root: style="" перекрывает `#root { min-height: 0 }`
      из index.css. На iOS standalone `-webkit-fill-available` снова растягивал корень
      выше --viewport-height → кремовая полоса под fixed-таббаром. Высота сплэша —
      у .app-splash (position:fixed + свои min-height в app-splash.css).
    -->
    <div id="root">
      <div class="app-splash" role="status" aria-live="polite" aria-label="Загрузка приложения">
        <div class="app-splash__bg" aria-hidden="true">
          <div class="app-splash__orb app-splash__orb--1"></div>
          <div class="app-splash__orb app-splash__orb--2"></div>
          <div class="app-splash__orb app-splash__orb--3"></div>
        </div>
        <div class="app-splash__center">
          <div class="app-splash__logo-shell">
            <span class="app-splash__halo"></span>
            <span class="app-splash__ring"></span>
            <span class="app-splash__ring app-splash__ring--2"></span>
            <img src="/assets/logo.svg" alt="" class="app-splash__logo" decoding="async" />
          </div>
          <h1 class="app-splash__title">Моя церковь</h1>
          <p class="app-splash__tagline">Цифровая платформа</p>
        </div>
        <div class="app-splash__footer" aria-hidden="true">
          <div class="app-splash__loader"><div class="app-splash__loader-bar"></div></div>
          <p class="app-splash__status">Загрузка</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
