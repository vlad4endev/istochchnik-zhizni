<!doctype html>
<html lang="ru" class="app-native-shell">
  <head>
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('mantine-color-scheme-value');
          const scheme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
        } catch {
          document.documentElement.setAttribute('data-mantine-color-scheme', 'light');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <!-- Без ручного pinch/double-tap zoom: размер — из ОС и панели доступности (CSS), не из зума страницы. -->
    <!-- Не добавлять interactive-widget: на части iOS PWA нестабильный разбор viewport → «белый экран». См. nativeShellViewport.ts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Моя церковь" />
    <meta name="theme-color" content="#7d3640" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#5c2830" media="(prefers-color-scheme: dark)" />
    <!-- iOS «На экран Домой»: полноэкранный режим и имя под иконкой -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Дубль для новых версий WebKit (рядом с apple-* для совместимости) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Моя церковь" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Моя церковь - цифровая платформа</title>
    <!-- Иконки и favicon (public/assets; см. npm run pwa:icons) -->
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
    <!-- Одна иконка 180×180: Apple сам масштабирует; дубли с «левыми» sizes давали лишний шум и путаницу для WebKit. -->
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon-180x180.png" sizes="180x180" />
    <!-- Сплэш при запуске с экрана Домой (public/pwa; см. npm run pwa:splash) -->
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-2048-2732.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/pwa/apple-splash-1668-2388.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

  <body style="margin:0;background:#f4f1ed">
    <!-- До загрузки CSS/React: не оставлять чисто белый фон (типичная жалоба в iOS PWA). -->
    <div id="root" style="min-height:100dvh;min-height:-webkit-fill-available"></div>
