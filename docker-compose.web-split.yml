# Два фронтенда (Main + Studio) рядом с существующим API.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.web-split.yml up -d --build
# Остановите отдельный сервис `web`, если он конфликтует по портам: docker compose stop web
#
# Переменные (пример прод):
#   VITE_API_BASE_URL=https://church-tambov.ru
#   VITE_PWA_MAIN_ORIGIN=https://church-tambov.ru
#   VITE_PWA_STUDIO_ORIGIN=https://studio.church-tambov.ru
# На API: AUTH_COOKIE_DOMAIN=.church-tambov.ru и CORS_ALLOWED_ORIGINS с обоими origin.

services:
  web-main:
    build:
      context: .
      dockerfile: docker/Dockerfile.web.main
      args:
        VITE_APP_VARIANT: main
        VITE_PWA_ORIGIN: ${VITE_PWA_MAIN_ORIGIN:-}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: istochnik-web-main
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_MAIN_PORT:-3000}:80"

  web-studio:
    build:
      context: .
      dockerfile: docker/Dockerfile.web.studio
      args:
        VITE_APP_VARIANT: studio
        VITE_PWA_ORIGIN: ${VITE_PWA_STUDIO_ORIGIN:-}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: istochnik-web-studio
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_STUDIO_PORT:-3001}:80"
