# Опциональный LiveKit Server для аудио/видеозвонков.
# Запуск (пример с основным стеком):
#   docker compose -f docker-compose.yml -f docker-compose.livekit-addon.yml up -d
#
# В .env задайте:
#   LIVEKIT_API_KEY=...
#   LIVEKIT_API_SECRET=...
#   LIVEKIT_PUBLIC_URL=wss://app.church-tambov.ru/lk
#   PUBLIC_WEB_ORIGIN=https://app.church-tambov.ru
#   CALLS_ENABLED=true
#   # НЕ используйте call.church-tambov.ru, если DNS/nginx для него не настроены.
#   # публичный IP сервера для ICE (обязательно за NAT/домашним роутером):
#   LIVEKIT_RTC_NODE_IP=203.0.113.10
#
# UDP 50000-50100 и TCP 7881 — с интернета (или TURN).
# 7880 только на loopback; снаружи — nginx WSS.

services:
  livekit:
    image: livekit/livekit-server:v1.8.4
    restart: always
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      # Формат: key: secret  (пробел после двоеточия допустим)
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_RTC_NODE_IP: "${LIVEKIT_RTC_NODE_IP:-}"
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    networks:
      - default
    # Образ distroless/minimal — wget/curl часто отсутствуют; проверяем TCP-порт процессом.
    healthcheck:
      test: ["CMD", "/livekit-server", "--version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api:
    depends_on:
      livekit:
        condition: service_started
    environment:
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-wss://app.church-tambov.ru/lk}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      CALLS_ENABLED: ${CALLS_ENABLED:-true}
      CALL_RING_TIMEOUT_SEC: ${CALL_RING_TIMEOUT_SEC:-60}
      CALL_TOKEN_TTL_SEC: ${CALL_TOKEN_TTL_SEC:-900}
      CALL_INVITE_TTL_HOURS: ${CALL_INVITE_TTL_HOURS:-24}
      CALL_MAX_GROUP_PARTICIPANTS: ${CALL_MAX_GROUP_PARTICIPANTS:-50}

  # web проксирует /lk/ → livekit (upstream livekit_signal).
  # ВАЖНО: всегда с обоими compose-файлами, иначе hostname livekit не резолвится → 500/502 на /lk/.
  web:
    depends_on:
      livekit:
        condition: service_started
    networks:
      - default
