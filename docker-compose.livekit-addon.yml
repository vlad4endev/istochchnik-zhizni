# Опциональный LiveKit Server для аудио/видеозвонков.
# Запуск (пример с основным стеком):
#   docker compose -f docker-compose.yml -f docker-compose.livekit-addon.yml up -d
#
# В .env задайте:
#   LIVEKIT_API_KEY=...
#   LIVEKIT_API_SECRET=...
#   LIVEKIT_PUBLIC_URL=wss://app.church-tambov.ru/lk
#   PUBLIC_WEB_ORIGIN=https://app.church-tambov.ru
#   CALLS_ENABLED=true
#   # Белый IP WAN (не 192.168.x!) — обязателен для стабильного ICE:
#   LIVEKIT_RTC_NODE_IP=77.93.125.36
#
# На роутере проброс на хост Docker (например 192.168.1.203):
#   TCP 7881 → 7881
#   UDP 50000–50019 → 50000–50019  (каждый порт в порт, НЕ 50000→50100)
# 7880 только на loopback; снаружи — nginx WSS /lk.

services:
  livekit:
    image: livekit/livekit-server:v1.8.4
    restart: always
    # --node-ip обязателен за NAT: иначе ICE-кандидаты с docker-IP → «Переподключение…»
    command:
      - --config
      - /etc/livekit.yaml
      - --node-ip
      - ${LIVEKIT_RTC_NODE_IP:?Set LIVEKIT_RTC_NODE_IP to your public WAN IP}
    environment:
      # Формат: key: secret  (пробел после двоеточия допустим)
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_RTC_NODE_IP: "${LIVEKIT_RTC_NODE_IP:?Set LIVEKIT_RTC_NODE_IP to your public WAN IP}"
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "50000-50019:50000-50019/udp"
    networks:
      - default
    healthcheck:
      test: ["CMD", "/livekit-server", "--version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api:
    depends_on:
      livekit:
        condition: service_started
    environment:
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-wss://app.church-tambov.ru/lk}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      CALLS_ENABLED: ${CALLS_ENABLED:-true}
      CALL_RING_TIMEOUT_SEC: ${CALL_RING_TIMEOUT_SEC:-60}
      CALL_TOKEN_TTL_SEC: ${CALL_TOKEN_TTL_SEC:-900}
      CALL_INVITE_TTL_HOURS: ${CALL_INVITE_TTL_HOURS:-24}
      CALL_MAX_GROUP_PARTICIPANTS: ${CALL_MAX_GROUP_PARTICIPANTS:-50}

  web:
    depends_on:
      livekit:
        condition: service_started
    networks:
      - default
