# LiveKit для аудио/видеозвонков.
#
#   bash scripts/repair-livekit.sh
#   docker compose -f docker-compose.yml -f docker-compose.livekit-addon.yml up -d --build
#
# .env (ОДИН блок, ключи обязательны):
#   LIVEKIT_API_KEY=APIxxxxxxxx
#   LIVEKIT_API_SECRET=xxxxxxxx  # ≥32 символов
#   LIVEKIT_PUBLIC_URL=wss://app.church-tambov.ru/lk
#   PUBLIC_WEB_ORIGIN=https://app.church-tambov.ru
#   CALLS_ENABLED=true
#   VITE_CALLS_ENABLED=true
#   LIVEKIT_RTC_NODE_IP=77.93.125.36
#
# Роутер → LAN IP хоста:
#   TCP 7881 → 7881
#   UDP 7882 → 7882
#   (TURN выключен в livekit.yaml; когда включите: UDP 3478, UDP 50100)
#   7880 наружу НЕ открывать
#
# Рекомендуется: /etc/docker/daemon.json → { "userland-proxy": false }
# sysctl: см. deploy/sysctl-livekit.conf
#
# Сеть: bridge (не host). Signal доступен как livekit:7880 из api/web —
# host.docker.internal с host-network часто недоступен из bridge (UFW/iptables) → /lk 504.

services:
  livekit:
    image: livekit/livekit-server:v1.8.4
    restart: always
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
      NODE_IP: ${LIVEKIT_RTC_NODE_IP:-77.93.125.36}
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro
      - ./docker/livekit-entrypoint.sh:/entrypoint.sh:ro
    ports:
      # Signal только в Docker-сеть + localhost (web/api → livekit:7880)
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    healthcheck:
      test: ["CMD", "/livekit-server", "--version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api:
    depends_on:
      livekit:
        condition: service_started
    environment:
      # Docker DNS имя сервиса (bridge), не host.docker.internal
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-wss://app.church-tambov.ru/lk}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
      CALLS_ENABLED: ${CALLS_ENABLED:-true}
      CALL_RING_TIMEOUT_SEC: ${CALL_RING_TIMEOUT_SEC:-60}
      CALL_TOKEN_TTL_SEC: ${CALL_TOKEN_TTL_SEC:-900}
      CALL_INVITE_TTL_HOURS: ${CALL_INVITE_TTL_HOURS:-24}
      CALL_MAX_GROUP_PARTICIPANTS: ${CALL_MAX_GROUP_PARTICIPANTS:-50}

  web:
    depends_on:
      livekit:
        condition: service_started
