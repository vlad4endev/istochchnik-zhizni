# Опциональный LiveKit Server для аудио/видеозвонков.
# Запуск (пример с основным стеком):
#   docker compose -f docker-compose.yml -f docker-compose.livekit-addon.yml up -d
# Или с prod Postgres-стеком:
#   docker compose -f docker-compose.prod.yml -f docker-compose.livekit-addon.yml up -d
#
# В .env задайте:
#   LIVEKIT_API_KEY=...
#   LIVEKIT_API_SECRET=...
#   LIVEKIT_PUBLIC_URL=wss://call.church-tambov.ru
#   CALLS_ENABLED=true
#   # опционально публичный IP для RTC:
#   LIVEKIT_RTC_NODE_IP=203.0.113.10
#
# UDP 50000-50100 и TCP 7881 должны быть доступны с интернета (или через TURN).
# Админский HTTP LiveKit (7880) публикуем только на loopback — наружу идёт nginx WSS.

services:
  livekit:
    image: livekit/livekit-server:v1.8.4
    restart: always
    command: ["--config", "/etc/livekit.yaml", "--bind", "0.0.0.0"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}:${LIVEKIT_API_SECRET}"
      LIVEKIT_RTC_NODE_IP: "${LIVEKIT_RTC_NODE_IP:-}"
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  api:
    depends_on:
      livekit:
        condition: service_healthy
    environment:
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-wss://call.church-tambov.ru}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      CALLS_ENABLED: ${CALLS_ENABLED:-true}
      CALL_RING_TIMEOUT_SEC: ${CALL_RING_TIMEOUT_SEC:-60}
      CALL_TOKEN_TTL_SEC: ${CALL_TOKEN_TTL_SEC:-900}
      CALL_INVITE_TTL_HOURS: ${CALL_INVITE_TTL_HOURS:-24}
      CALL_MAX_GROUP_PARTICIPANTS: ${CALL_MAX_GROUP_PARTICIPANTS:-50}