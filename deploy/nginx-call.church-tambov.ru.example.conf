# Пример виртуального хоста для LiveKit: call.church-tambov.ru
# TLS обычно через Nginx Proxy Manager / certbot — ниже только proxy к LiveKit.
#
# Важно:
# - Клиенты подключаются по WSS к этому хосту (LIVEKIT_PUBLIC_URL=wss://call.church-tambov.ru).
# - UDP 50000-50100 и TCP 7881 должны быть проброшены на хост с контейнером LiveKit
#   (nginx HTTP/WSS не заменяет WebRTC UDP).
# - Не публикуйте административные API LiveKit в интернет без auth; 7880 слушает loopback.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl http2;
    server_name call.church-tambov.ru;

    # ssl_certificate /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}