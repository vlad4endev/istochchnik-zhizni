services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: istochnik-api
    restart: unless-stopped
    environment:
      PORT: "40978"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DB_SSL: ${DB_SSL:-true}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}
      DB_DEBUG_LOG: ${DB_DEBUG_LOG:-false}
      SKIP_DB_INIT_ON_START: ${SKIP_DB_INIT_ON_START:-true}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-30}
      AUTH_MAX_ACTIVE_SESSIONS_PER_USER: ${AUTH_MAX_ACTIVE_SESSIONS_PER_USER:-5}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      REDIS_REALTIME_ENABLED: ${REDIS_REALTIME_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET_MESSENGER: ${SUPABASE_STORAGE_BUCKET_MESSENGER:-messenger}
      SUPABASE_STORAGE_BUCKET_USER_MEDIA: ${SUPABASE_STORAGE_BUCKET_USER_MEDIA:-user-media}
      MESSENGER_ATTACHMENT_SIGNED_URL_TTL_SEC: ${MESSENGER_ATTACHMENT_SIGNED_URL_TTL_SEC:-3600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # PORT в .env — порт на хосте; внутри контейнера API всегда 40978.
      - "${PORT:-40978}:40978"
