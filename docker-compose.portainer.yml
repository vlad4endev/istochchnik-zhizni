services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: istochnik-api
    restart: unless-stopped
    environment:
      PORT: "40978"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DB_SSL: ${DB_SSL:-true}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}
      DB_DEBUG_LOG: ${DB_DEBUG_LOG:-false}
      SKIP_DB_INIT_ON_START: ${SKIP_DB_INIT_ON_START:-true}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-30}
      AUTH_ACCESS_TOKEN_TTL_MINUTES: ${AUTH_ACCESS_TOKEN_TTL_MINUTES:-60}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-90}
      AUTH_MAX_REFRESH_SESSIONS_PER_USER: ${AUTH_MAX_REFRESH_SESSIONS_PER_USER:-15}
      AUTH_MAX_ACCESS_SESSIONS_PER_USER: ${AUTH_MAX_ACCESS_SESSIONS_PER_USER:-30}
      # Поддоменный cookie (напр. AUTH_COOKIE_DOMAIN=.church-tambov.ru) — иначе refresh/logout ломаются на split web/api.
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-Lax}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-auth_access_token}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-auth_refresh_token}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-/app/secrets/firebase-sa.json}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/secrets/firebase-sa.json}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      REDIS_REALTIME_ENABLED: ${REDIS_REALTIME_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_PUBLIC_URL: ${SUPABASE_STORAGE_PUBLIC_URL:-}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-}
      SUPABASE_STORAGE_LEGACY_ORIGINS: ${SUPABASE_STORAGE_LEGACY_ORIGINS:-}
      SUPABASE_STORAGE_BUCKET_MESSENGER: ${SUPABASE_STORAGE_BUCKET_MESSENGER:-chat}
      SUPABASE_STORAGE_BUCKET_USER_MEDIA: ${SUPABASE_STORAGE_BUCKET_USER_MEDIA:-user-media}
      MESSENGER_ATTACHMENT_SIGNED_URL_TTL_SEC: ${MESSENGER_ATTACHMENT_SIGNED_URL_TTL_SEC:-3600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # PORT в .env — порт на хосте; внутри контейнера API всегда 40978.
      - "${PORT:-40978}:40978"
