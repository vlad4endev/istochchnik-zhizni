# LiveKit Server — «Источник жизни»
# Рекомендуемый режим: network_mode: host (см. docker-compose.livekit-addon.yml).
# Docs: https://docs.livekit.io/transport/self-hosting/

port: 7880
# 0.0.0.0 нужен, чтобы api/web (Docker) достучались через host.docker.internal.
# На роутере НЕ пробрасывайте 7880 наружу — только TCP 7881 и UDP 7882.
# Браузер ходит на WSS /lk (nginx → host:7880).
bind_addresses:
  - "0.0.0.0"

rtc:
  # Один UDP mux + TCP ICE (проброс на роутере: UDP 7882, TCP 7881)
  udp_port: 7882
  tcp_port: 7881
  # STUN → белый IP; advertise_internal_ip → 192.168.x для клиентов в той же Wi‑Fi
  # (без hairpin NAT звонок LAN↔LAN через публичный IP нестабилен).
  use_external_ip: true
  advertise_internal_ip: true
  skip_external_ip_validation: true
  stun_servers:
    - stun.l.google.com:19302

logging:
  level: info
