# LiveKit Server — «Источник жизни» (host network, совместимо с livekit-server v1.8.4)
# Docs: https://docs.livekit.io/transport/self-hosting/
# network_mode: host — см. docker-compose.livekit-addon.yml

port: 7880
# api/web → host.docker.internal:7880. На роутере 7880 НЕ пробрасывать.
bind_addresses:
  - "0.0.0.0"

rtc:
  udp_port: 7882
  tcp_port: 7881
  use_external_ip: true
  # Белый IP: задайте LIVEKIT_RTC_NODE_IP в .env → NODE_IP в compose (если STUN врёт).
  # Поля advertise_internal_ip / skip_external_ip_validation — только в LiveKit ≥1.9+rtcconfig;
  # в v1.8.4 из‑за них сервер не стартует (strict yaml).
  stun_servers:
    - stun.l.google.com:19302
  congestion_control:
    enabled: true
    allow_pause: true

# Встроенный TURN: если прямой UDP/TCP ICE рвётся, клиент идёт через relay.
# Роутер (по одному правилу, без диапазонов):
#   UDP 3478 → 3478, UDP 50100 → 50100
turn:
  enabled: true
  domain: app.church-tambov.ru
  udp_port: 3478
  # Один порт — роутеры без «диапазона» принимают только так.
  relay_range_start: 50100
  relay_range_end: 50100

room:
  empty_timeout: 900
  departure_timeout: 180
  enabled_codecs:
    - mime: audio/opus
    - mime: audio/red
    - mime: video/vp8

logging:
  level: info
