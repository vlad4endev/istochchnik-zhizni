# LiveKit Server — «Источник жизни» (bridge + ports, livekit-server v1.8.4)
# Docs: https://docs.livekit.io/transport/self-hosting/
# Сеть: docker-compose.livekit-addon.yml (api/web → http://livekit:7880)

port: 7880
# На роутере 7880 НЕ пробрасывать (только 7881/TCP и 7882/UDP).
bind_addresses:
  - "0.0.0.0"

rtc:
  udp_port: 7882
  tcp_port: 7881
  # НЕ use_external_ip: за домашним NAT STUN/self-check часто валит старт.
  # В v1.8.4 нет skip_external_ip_validation — задаём белый IP через NODE_IP (compose).
  use_external_ip: false

# TURN временно выключен: bind :3478 часто роняет процесс, пока не поднят :7880.
# Когда curl http://127.0.0.1:7880/ = OK — можно включить обратно (см. docs/calls-livekit.md).
turn:
  enabled: false

room:
  empty_timeout: 900
  departure_timeout: 180
  enabled_codecs:
    - mime: audio/opus
    - mime: audio/red
    - mime: video/vp8

logging:
  level: info
