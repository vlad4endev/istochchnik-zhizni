# LiveKit Server — «Источник жизни» (host network, livekit-server v1.13.9)
# Docs: https://docs.livekit.io/transport/self-hosting/
# network_mode: host — ICE видит белый IP и LAN (без hairpin-ломалки).

port: 7880
# api/web → host.docker.internal:7880. На роутере 7880 НЕ пробрасывать.
bind_addresses:
  - "0.0.0.0"

rtc:
  udp_port: 7882
  tcp_port: 7881
  # Не включать. use_external_ip: true заставляет Validate сходить в STUN до bind :7880.
  # Если исходящий UDP до STUN недоступен, процесс падает:
  #   could not validate RTC config: could not resolve external IP: context deadline exceeded
  # Белый IP передаёт entrypoint флагом --node-ip из NODE_IP (LIVEKIT_RTC_NODE_IP).
  # При заданном node_ip флаг use_external_ip всё равно имеет приоритет и STUN не пропускается.
  use_external_ip: false
  # WAN-кандидат из --node-ip плюс LAN-адреса хоста (клиенты в той же сети).
  advertise_internal_ip: true
  stun_servers:
    - stun.l.google.com:19302
  congestion_control:
    enabled: true
    allow_pause: true

# TURN relay. КАЖДАЯ relay-алокация занимает ОДИН порт из диапазона, т.е.
# ширина диапазона = максимум relayed-участников (симметричный NAT, мобильные
# сети, корпоративный Wi-Fi) одновременно на ВЕСЬ сервер. При исчерпании —
# «не слышно»/обрыв без явной ошибки у новых relayed-участников.
# 50100–50999 = 900 портов: полный групповой звонок (50 чел.), где ВСЕ за
# симметричным NAT, × несколько звонков одновременно, с запасом.
# Порты биндятся по требованию (на алокацию): простаивающий диапазон ничего
# не стоит, но каждая алокация = UDP-сокет = файловый дескриптор — держим
# ulimits.nofile 65535 в docker-compose.livekit-addon.yml.
# Роутер: UDP 3478 → 3478, UDP 50100–50999 → 50100–50999 (одно правило
# диапазона). Если роутер не умеет диапазоны — сузить здесь до 50100–50199
# (100 relayed-участников), пробросить по одному правилу на порт и держать
# start/end синхронными с пробросом.
turn:
  enabled: true
  domain: app.church-tambov.ru
  udp_port: 3478
  relay_range_start: 50100
  relay_range_end: 50999
  # TURN/TLS — единственный транспорт для сетей, где UDP закрыт полностью
  # (корпоративные Wi-Fi). Нужен сертификат на turn.domain; на роутере
  # пробросить TCP 5349 → 5349. Раскомментировать и положить PEM в docker/:
  # tls_port: 5349
  # cert_file: /etc/livekit-tls/fullchain.pem
  # key_file: /etc/livekit-tls/privkey.pem

room:
  empty_timeout: 900
  departure_timeout: 180
  # auto_create: false — усиление после стабилизации api→7880: запретит вход
  # по протухшим JWT в удалённые комнаты и гарантирует maxParticipants.
  enabled_codecs:
    - mime: audio/opus
    - mime: audio/red
    - mime: video/vp8
    # h264 — аппаратный кодек iOS/Android: меньше CPU/нагрев/«зависаний» на слабых
    # устройствах; обязателен для старых Safari без VP8. vp9 — SVC для групп.
    - mime: video/h264
    - mime: video/vp9

logging:
  level: info
