# LiveKit Server — «Источник жизни» (host network, livekit-server v1.13.9)
# Docs: https://docs.livekit.io/transport/self-hosting/
# network_mode: host — ICE видит белый IP и LAN (без hairpin-ломалки).

port: 7880
# api/web → host.docker.internal:7880. На роутере 7880 НЕ пробрасывать.
bind_addresses:
  - "0.0.0.0"

rtc:
  udp_port: 7882
  tcp_port: 7881
  use_external_ip: true
  # v1.13+: оба кандидата (WAN + LAN) + без self-ping за NAT
  advertise_internal_ip: true
  skip_external_ip_validation: true
  stun_servers:
    - stun.l.google.com:19302
  congestion_control:
    enabled: true
    allow_pause: true

# TURN relay. КАЖДАЯ relay-алокация занимает ОДИН порт из диапазона:
# диапазон из 1 порта = только 1 участник с relay на весь сервер, остальные
# за симметричным NAT (мобильные сети) получают «не слышно»/обрыв.
# Роутер: UDP 3478 → 3478, UDP 50100–50119 → 50100–50119
# (роутеры без диапазонов — 20 отдельных правил, по одному на порт).
turn:
  enabled: true
  domain: app.church-tambov.ru
  udp_port: 3478
  relay_range_start: 50100
  relay_range_end: 50119
  # tls_port: 5349  # + cert_file/key_file — для сетей, где UDP закрыт полностью

room:
  empty_timeout: 900
  departure_timeout: 180
  # auto_create: false — усиление после стабилизации api→7880: запретит вход
  # по протухшим JWT в удалённые комнаты и гарантирует maxParticipants.
  enabled_codecs:
    - mime: audio/opus
    - mime: audio/red
    - mime: video/vp8
    # h264 — аппаратный кодек iOS/Android: меньше CPU/нагрев/«зависаний» на слабых
    # устройствах; обязателен для старых Safari без VP8. vp9 — SVC для групп.
    - mime: video/h264
    - mime: video/vp9

logging:
  level: info
