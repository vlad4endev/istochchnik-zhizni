# LiveKit Server config for «Источник жизни».
# Keys: env LIVEKIT_KEYS (см. docker-compose.livekit-addon.yml).
# Docs: https://docs.livekit.io/transport/self-hosting/

port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  port_range_start: 50000
  port_range_end: 50100
  tcp_port: 7881
  # STUN-обнаружение публичного IP для ICE. Если сервер за NAT и STUN врёт —
  # задайте явный IP: раскомментируйте node_ip ниже (публичный IP VPS).
  use_external_ip: true
  # node_ip: 203.0.113.10
  stun_servers:
    - stun.l.google.com:19302

logging:
  level: info
