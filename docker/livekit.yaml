# LiveKit Server config for «Источник жизни».
# Keys: env LIVEKIT_KEYS (см. docker-compose.livekit-addon.yml).
# Публичный IP для ICE: CLI --node-ip из LIVEKIT_RTC_NODE_IP (обязателен за NAT).
# Docs: https://docs.livekit.io/transport/self-hosting/

port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  # Один UDP mux-порт вместо диапазона — проще проброс на роутере и меньше
  # проблем с Docker userland-proxy (иначе звонок «живёт» 3–10 с и переподключается).
  # Не задавайте port_range_* вместе с udp_port.
  udp_port: 7882
  tcp_port: 7881
  # node_ip задаётся флагом --node-ip (см. compose).
  use_external_ip: false
  stun_servers:
    - stun.l.google.com:19302

logging:
  level: info
