# LiveKit Server config for «Источник жизни».
# API key/secret задаются через env LIVEKIT_KEYS в docker-compose (не коммитьте секреты сюда).
# Docs: https://docs.livekit.io/transport/self-hosting/

port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  port_range_start: 50000
  port_range_end: 50100
  tcp_port: 7881
  # На домашнем NAT часто ломает старт (долгий/падающий lookup внешнего IP).
  # Включите true и задайте LIVEKIT_RTC_NODE_IP=публичный_IP, когда порт проброшен.
  use_external_ip: false

logging:
  level: info
