# Пример виртуальных хостов для church-tambov.ru и studio.church-tambov.ru.
# Предполагается, что на 127.0.0.1:3000 и :3001 проброшены контейнеры web-main и web-studio,
# а API доступен на 127.0.0.1:40978 (или за отдельным server_name api.church-tambov.ru).
#
# ssl_certificate / ssl_certificate_key — подставьте свои пути (Let's Encrypt).

upstream istochnik_api_upstream {
    server 127.0.0.1:40978;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Основной сайт (Main, порт 3000 → контейнер web-main)
server {
    listen 443 ssl http2;
    server_name church-tambov.ru www.church-tambov.ru;

    client_max_body_size 16m;

    location ~ ^/api(/|$) {
        proxy_pass http://istochnik_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /uploads/ {
        proxy_pass http://istochnik_api_upstream/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Студия (порт 3001 → контейнер web-studio)
server {
    listen 443 ssl http2;
    server_name studio.church-tambov.ru;

    client_max_body_size 16m;

    location ~ ^/api(/|$) {
        proxy_pass http://istochnik_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /uploads/ {
        proxy_pass http://istochnik_api_upstream/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
