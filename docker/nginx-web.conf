server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # SECURITY FIX: базовые security headers на edge-уровне.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss: ws:; form-action 'self'" always;

    location = /sw.js {
        try_files /sw.js =404;
        types { application/javascript js; }
        default_type application/javascript;
        send_timeout 30s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /manifest.webmanifest {
        try_files /manifest.webmanifest =404;
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /registerSW.js {
        try_files /registerSW.js =404;
        types { application/javascript js; }
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~* ^/workbox-[^/]+\.js$ {
        try_files $uri =404;
        types { application/javascript js; }
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # См. nginx-web.unified.conf — HTML для клиентских маршрутов не должен долго кэшироваться.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
