# SPA (React/Vite) + прокси к Node API (один порт для браузера).

upstream istochnik_api {
    server api:40978;
    keepalive 32;
}

# Self-hosted Supabase (Kong). Нужен, если в ответах API в браузер уходит
# https://<тот же хост что SPA>/storage/v1/... (SUPABASE_STORAGE_PUBLIC_URL = origin приложения).
# Иначе regex «*.jpg» ниже перехватит /storage/v1/.../uuid.jpg → try_files в root → 404.
# Смените host:port на ваш Kong (часто совпадает с портом из SUPABASE_URL на хосте, напр. 172.17.0.1:8085).
upstream supabase_kong {
    server 172.17.0.1:8085;
    keepalive 8;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # SECURITY FIX: базовые security headers на edge-уровне.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss: ws:; form-action 'self'" always;

    # Видео в мессенджере до 1GB; остальные вложения на API по-прежнему ограничены приложением (20MB).
    client_max_body_size 1024m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 256;

    # Service Worker: не кэшировать (иначе iOS PWA «залипает» на старой версии).
    # Важно: exact-match `=` выше по приоритету, чем regex ниже для *.js.
    location = /sw.js {
        try_files /sw.js =404;
        types { application/javascript js; }
        default_type application/javascript;
        send_timeout 30s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /manifest.webmanifest {
        try_files /manifest.webmanifest =404;
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /registerSW.js {
        try_files /registerSW.js =404;
        types { application/javascript js; }
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~* ^/workbox-[^/]+\.js$ {
        try_files $uri =404;
        types { application/javascript js; }
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Supabase Storage API — выше regex *.jpg, иначе картинки чата 404.
    location ^~ /storage/v1/ {
        proxy_pass http://supabase_kong;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Статика SPA — кэш
    # Важно: regex по расширению иначе перехватывает /api/uploads/.../file.jpg (try_files в root → 404).
    # Prefix ^~ снимает приоритет с regex для этого префикса.
    location ^~ /api/uploads/ {
        proxy_pass http://istochnik_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|wasm)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Только реальные маршруты API (/api, /api/..., но не /api-config.json)
    location ~ ^/api(/|$) {
        proxy_pass http://istochnik_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # User-uploaded files (avatars, etc.) are served by API under /uploads.
    # Without this, browser requests to https://<web-host>/uploads/* return 404 from nginx static root.
    # Внешний прокси (Nginx Proxy Manager в Docker): не используйте 127.0.0.1:40978 — это loopback контейнера NPM.
    # Укажите шлюз хоста (часто 172.17.0.1) или имя сервиса api в общей docker-сети.
    location ^~ /uploads/ {
        proxy_pass http://istochnik_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://istochnik_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback: без no-cache браузер кэширует HTML для `/`, `/messenger`, … со старыми `<script src=/assets/*.js>`.
    # После деплоя хеши меняются → 404 на чанках (MessengerRoutes-XXXX.js), «белый экран». Regex выше для *.js перехватывает статику.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
