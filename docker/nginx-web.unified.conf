# SPA (React/Vite) + прокси к Node API (один порт для браузера).

upstream istochnik_api {
    server api:40978;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 256;

    # Service Worker: не кэшировать (иначе iOS PWA «залипает» на старой версии).
    # Важно: exact-match `=` выше по приоритету, чем regex ниже для *.js.
    location = /sw.js {
        try_files /sw.js =404;
        types { application/javascript js; }
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /manifest.webmanifest {
        try_files /manifest.webmanifest =404;
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /registerSW.js {
        try_files /registerSW.js =404;
        types { application/javascript js; }
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~* ^/workbox-[^/]+\.js$ {
        try_files $uri =404;
        types { application/javascript js; }
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Статика SPA — кэш
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|wasm)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Только реальные маршруты API (/api, /api/..., но не /api-config.json)
    location ~ ^/api(/|$) {
        proxy_pass http://istochnik_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    # User-uploaded files (avatars, etc.) are served by API under /uploads.
    # Without this, browser requests to https://<web-host>/uploads/* return 404 from nginx static root.
    location ^~ /uploads/ {
        proxy_pass http://istochnik_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://istochnik_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
