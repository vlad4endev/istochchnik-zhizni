# Overlay к docker-compose.yml для прод-деплоя (тот же COMPOSE_FILE, что в deploy-production.sh).
#
# Раньше здесь был второй services.api.ports (127.0.0.1:…). Compose объединяет списки портов
# с docker-compose.yml → два проброса одного хост-порта → "address already in use", при этом сокет мог
# не попадать в ss так, как у обычного процесса.
#
# Привязка API только к loopback: в .env задайте API_PUBLISH=127.0.0.1 (см. ports в docker-compose.yml).

services:
  api:
    labels:
      istochik.stack: production
