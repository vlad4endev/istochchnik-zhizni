# Один стек в Portainer: API + веб (nginx + React/Vite), внешняя БД (Supabase и т.д.).
# Секреты только через Environment в UI, не коммитьте .env с паролями.
#
# Развёртывание: Stack → Web editor → вставить этот файл + задать переменные ниже.
#
# Обязательные переменные:
#   DATABASE_URL, WEB_PORT (например 8080)
# Опционально: PORT (внутренний порт API, по умолчанию 40978)
#
# ─── Постоянные файлы (чат, аватары) — ОБЯЗАТЕЛЬНО на проде ─────────────────
# Вариант A (ниже по умолчанию): именованный том `istochnik_app_uploads` → в контейнере /app/uploads.
#   Файлы переживают перезапуск контейнера. Docker хранит их на диске сервера (обычно
#   /var/lib/docker/volumes/<имя_стека>_istochnik_app_uploads/_data).
#   НЕ удаляйте том: в Portainer при удалении стека не включайте опции, которые сносят volumes;
#   не используйте `docker stack rm` / `compose down -v` с удалением volumes.
#
# Вариант B (удобнее бэкапить с хоста): каталог на VPS вместо именованного тома.
#   1) На сервере: sudo mkdir -p /var/lib/istochnik/uploads && sudo chown 1001:1001 /var/lib/istochnik/uploads
#      (uid 1001 = пользователь `app` внутри образа API)
#   2) В services.api.volumes замените строку с именованным томом на:
#        - /var/lib/istochnik/uploads:/app/uploads
#   3) Удалите из секции `volumes:` внизу файла неиспользуемое имя `istochnik_app_uploads:`.
#   4) В Environment стека можно задать UPLOADS_DIR=/app/uploads (или не задавать — это значение по умолчанию).
#
# Проверка: в логах контейнера api при старте строка [uploads] serving static files from: ...

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: istochnik-api
    restart: unless-stopped
    volumes:
      - istochnik_app_uploads:/app/uploads
      - ./secrets:/app/secrets:ro
    environment:
      PORT: "40978"
      UPLOADS_DIR: ${UPLOADS_DIR:-}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in Portainer}
      DB_SSL: ${DB_SSL:-true}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}
      DB_DEBUG_LOG: ${DB_DEBUG_LOG:-false}
      SKIP_DB_INIT_ON_START: ${SKIP_DB_INIT_ON_START:-true}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-30}
      AUTH_MAX_REFRESH_SESSIONS_PER_USER: ${AUTH_MAX_REFRESH_SESSIONS_PER_USER:-15}
      AUTH_MAX_ACCESS_SESSIONS_PER_USER: ${AUTH_MAX_ACCESS_SESSIONS_PER_USER:-30}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-/app/secrets/firebase-sa.json}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/secrets/firebase-sa.json}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      REDIS_REALTIME_ENABLED: ${REDIS_REALTIME_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_PUBLIC_URL: ${SUPABASE_STORAGE_PUBLIC_URL:-}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-}
      SUPABASE_STORAGE_LEGACY_ORIGINS: ${SUPABASE_STORAGE_LEGACY_ORIGINS:-}
      SUPABASE_STORAGE_BUCKET_MESSENGER: ${SUPABASE_STORAGE_BUCKET_MESSENGER:-chat}
      SUPABASE_STORAGE_BUCKET_USER_MEDIA: ${SUPABASE_STORAGE_BUCKET_USER_MEDIA:-user-media}
      MESSENGER_ATTACHMENT_SIGNED_URL_TTL_SEC: ${MESSENGER_ATTACHMENT_SIGNED_URL_TTL_SEC:-3600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "40978"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:40978/health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_PWA_ORIGIN: ${VITE_PWA_ORIGIN:-}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_SUPABASE_STORAGE_PUBLIC_URL: ${VITE_SUPABASE_STORAGE_PUBLIC_URL:-${PUBLIC_WEB_ORIGIN:-${VITE_PWA_ORIGIN:-}}}
        GITHUB_SHA: ${GITHUB_SHA:-}
    container_name: istochnik-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  istochnik_app_uploads:
