services:
  db:
    image: postgres:16-alpine
    container_name: istochnik-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-istochik_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-istochik_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: istochnik-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Внутри контейнера всегда 40978 (nginx → api). PORT в .env — порт на хосте.
      PORT: "40978"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}
      DB_DEBUG_LOG: ${DB_DEBUG_LOG:-false}
      SKIP_DB_INIT_ON_START: ${SKIP_DB_INIT_ON_START:-false}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-30}
      AUTH_MAX_ACTIVE_SESSIONS_PER_USER: ${AUTH_MAX_ACTIVE_SESSIONS_PER_USER:-5}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    ports:
      # Прямой доступ к API с хоста (curl, отладка). UI в браузере — через сервис web.
      # В docker-compose.prod.overlay.yml порт API привязан к 127.0.0.1.
      - "${PORT:-40978}:40978"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:40978/health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: istochnik-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  postgres_data:
