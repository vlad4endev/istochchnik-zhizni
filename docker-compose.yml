services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: istochnik-api
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
    environment:
      PORT: "40978"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}
      DB_DEBUG_LOG: ${DB_DEBUG_LOG:-false}
      SKIP_DB_INIT_ON_START: ${SKIP_DB_INIT_ON_START:-false}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-30}
      AUTH_MAX_ACTIVE_SESSIONS_PER_USER: ${AUTH_MAX_ACTIVE_SESSIONS_PER_USER:-5}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      REDIS_REALTIME_ENABLED: ${REDIS_REALTIME_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      # Публичный HTTPS-origin для URL Storage в ответах API (mixed content). Часто = домен SPA с proxy /storage/v1/
      SUPABASE_STORAGE_PUBLIC_URL: ${SUPABASE_STORAGE_PUBLIC_URL:-}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-}
      SUPABASE_STORAGE_LEGACY_ORIGINS: ${SUPABASE_STORAGE_LEGACY_ORIGINS:-}
      SUPABASE_STORAGE_BUCKET_MESSENGER: ${SUPABASE_STORAGE_BUCKET_MESSENGER:-chat}
      SUPABASE_STORAGE_BUCKET_USER_MEDIA: ${SUPABASE_STORAGE_BUCKET_USER_MEDIA:-user-media}
      MESSENGER_ATTACHMENT_SIGNED_URL_TTL_SEC: ${MESSENGER_ATTACHMENT_SIGNED_URL_TTL_SEC:-3600}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Хост RSS-фида для DNS healthcheck подкастов.
      PODCAST_RSS_HEALTH_HOST: ${PODCAST_RSS_HEALTH_HOST:-rss.castbox.fm}
    networks:
      - default
      - supabase_network
    expose:
      - "40978"
    ports:
      - "${API_PUBLISH:-127.0.0.1}:${PORT:-40978}:40978"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:40978/health >/dev/null || exit 1; node -e \"const dns=require('node:dns').promises; const host=process.env.PODCAST_RSS_HEALTH_HOST||'rss.castbox.fm'; dns.lookup(host).then(()=>process.exit(0)).catch(()=>process.exit(1));\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_PWA_ORIGIN: ${VITE_PWA_ORIGIN:-}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_MESSENGER_ORIGIN: ${VITE_MESSENGER_ORIGIN:-}
        # Сборка: подмена http://kong…/storage в бандле; приоритет VITE_* → PUBLIC_WEB_ORIGIN → PWA origin
        VITE_SUPABASE_STORAGE_PUBLIC_URL: ${VITE_SUPABASE_STORAGE_PUBLIC_URL:-${PUBLIC_WEB_ORIGIN:-${VITE_PWA_ORIGIN:-}}}
    container_name: istochnik-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  istochnik-web-data:

networks:
  supabase_network:
    external: true
    name: supabase_default
