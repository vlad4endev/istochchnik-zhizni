services:
  db:
    image: postgres:16-alpine
    container_name: istochnik-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-istochik_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-istochik_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Не удаляйте том: docker compose down -v сбросит БД и якорь молитвенного цикла.
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: istochnik-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Аватары и вложения мессенджера: общий том, чтобы файлы переживали restart и были видны всем репликам.
    volumes:
      - app_uploads:/app/uploads
    environment:
      # Внутри контейнера всегда 40978 (nginx → api). PORT в .env — порт на хосте.
      PORT: "40978"
      UPLOADS_DIR: ${UPLOADS_DIR:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}
      DB_DEBUG_LOG: ${DB_DEBUG_LOG:-false}
      SKIP_DB_INIT_ON_START: ${SKIP_DB_INIT_ON_START:-false}
      PRAYER_CYCLE_START_DATE: ${PRAYER_CYCLE_START_DATE:-}
      PRAYER_CYCLE_SYNC_FROM_ENV: ${PRAYER_CYCLE_SYNC_FROM_ENV:-false}
      PRAYER_CYCLE_FORCE_RESTORE: ${PRAYER_CYCLE_FORCE_RESTORE:-false}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-30}
      AUTH_MAX_ACTIVE_SESSIONS_PER_USER: ${AUTH_MAX_ACTIVE_SESSIONS_PER_USER:-5}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # WebSocket fan-out; из контейнера 127.0.0.1 — не хост. Redis на хосте: REDIS_URL=redis://host.docker.internal:6380
      REDIS_REALTIME_ENABLED: ${REDIS_REALTIME_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Один проброс: Compose склеивает ports из нескольких файлов — дубль того же ${PORT} даёт bind error.
      # Снаружи: API_PUBLISH:PORT → 40978 в контейнере. Прод на том же хосте: API_PUBLISH=127.0.0.1 в .env
      - "${API_PUBLISH:-0.0.0.0}:${PORT:-40978}:40978"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:40978/health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_PWA_ORIGIN: ${VITE_PWA_ORIGIN:-}
    container_name: istochnik-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  postgres_data:
  app_uploads:
